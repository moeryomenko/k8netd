[package]
name = "k8netd-vhost"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "vhost-user backend ports for the k8netd L2 switch"

[dependencies]
virtio-queue = "0.18.0"
vhost = { version = "0.17.0", features = ["vhost-user-frontend"] }
vhost-user-backend = "0.23.0"
vm-memory = { version = "0.18.0", features = ["backend-mmap"] }
vmm-sys-util = "0.15"
libc = "0.2"
